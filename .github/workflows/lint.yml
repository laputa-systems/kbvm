name: lint

on:
  pull_request:
  push:
    branches: [master]

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: laputa-systems/buildlib/setup@4ed2e0a1e0a5d23911ffccdd97349d30a7885f01 # v0.3.2
        with:
          tools: gluon
          lock: .github/tools.lock.json
      - name: build libxkbcommon
        run: |
          sudo apt-get update
          sudo apt-get install -y bison libxml2-dev
          meson setup libxkbcommon/build libxkbcommon -Ddefault_library=static -Denable-x11=false -Denable-wayland=false
          ninja -C libxkbcommon/build libxkbcommon.a
      - name: lint
        run: make lint
